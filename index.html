<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The heart, in the body</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body
    class="bg-[url('./src/assets/heart-background.jpg')] bg-cover bg-center bg-no-repeat bg-blend-multiply bg-black/10 font-diagram text-slate-900"
  >
    <main class="relative flex h-screen w-screen items-center justify-center overflow-hidden">
      <h1 id="page-heading" class="absolute top-6 left-6 text-xl font-bold text-slate-700 sm:text-2xl">
        The Human <span class="block sm:inline">Heart...</span>
      </h1>

      <div id="figure" class="relative aspect-[211/535] h-full max-h-[92vh]">
        <img
          id="body-outline"
          src="./src/assets/body-outline.png"
          alt=""
          aria-hidden="true"
          class="absolute inset-0 h-full w-full object-contain"
        />

        <div
          id="speech-bubble"
          class="absolute sm:[--bubble-left:78%]"
          style="--bubble-left: 68%; left: var(--bubble-left); top: -2%; width: clamp(120px, 30vw, 190px); aspect-ratio: 220 / 130"
        >
          <svg
            viewBox="0 0 220 130"
            preserveAspectRatio="none"
            aria-hidden="true"
            class="absolute inset-0 h-full w-full overflow-visible"
          >
            <path
              d="M128,98 C132,112 122,126 100,132 C114,120 118,108 112,96 Z"
              fill="powderblue"
              stroke="black"
              stroke-width="5"
              stroke-linejoin="round"
            />
            <ellipse cx="110" cy="58" rx="102" ry="54" fill="powderblue" stroke="black" stroke-width="6" />
            <g class="hidden sm:block">
              <path d="M60,14 Q40,6 24,14" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" />
              <path d="M182,26 Q198,34 206,48" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" />
            </g>
          </svg>
          <p
            class="relative z-10 flex items-center justify-center text-center text-[9px] leading-tight font-bold text-slate-800 sm:text-[13px] sm:leading-snug"
            style="height: 78%; padding: 0 10%"
          >
            Click or tap the heart to see how it works...
          </p>
        </div>

        <nav aria-label="Primary" class="contents">
          <a
            href="heart.html"
            id="heart-link"
            aria-label="View the heart"
            class="absolute block"
            style="left: 43%; top: 24%; width: 14%; height: 6.1%"
          >
            <img
              src="./src/assets/heart-icon.png"
              alt=""
              class="h-full w-full -rotate-3 object-contain"
            />
          </a>
        </nav>
      </div>
    </main>
  </body>
</html>
