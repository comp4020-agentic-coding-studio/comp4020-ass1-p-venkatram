<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The heart, in the body</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="bg-slate-50 font-diagram text-slate-900">
    <main class="relative flex h-screen w-screen flex-col items-center justify-center gap-4 overflow-hidden px-6 text-center">
      <h1 class="text-lg font-bold text-slate-800">The heart, in the body</h1>

      <div id="figure" class="relative aspect-[211/535] w-full min-h-0 flex-1 max-h-[78vh]">
        <img
          id="body-outline"
          src="./src/assets/body-outline.png"
          alt=""
          aria-hidden="true"
          class="absolute inset-0 h-full w-full object-contain"
        />

        <nav aria-label="Primary" class="contents">
          <a
            href="heart.html"
            id="heart-link"
            aria-label="View the heart"
            class="absolute block"
            style="left: 44%; top: 21%; width: 18%; height: 8%"
          >
            <img
              src="./src/assets/heart-icon.png"
              alt=""
              class="h-full w-full object-contain drop-shadow-sm"
            />
          </a>
        </nav>
      </div>

      <p class="text-sm font-bold text-sky-700">Tap the heart to look inside</p>
    </main>
    <script type="module" src="./landing.ts"></script>
  </body>
</html>
