<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slices through the heart</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body
    class="bg-[url('./src/assets/heart-background.jpg')] bg-cover bg-center bg-fixed bg-no-repeat bg-blend-multiply bg-black/10 font-diagram text-slate-900"
  >
    <main class="relative flex h-dvh flex-col overflow-hidden pt-12 sm:h-screen sm:flex-row sm:pt-0">
      <h1
        id="anatomy-heading"
        class="pointer-events-none fixed inset-x-0 top-2 z-40 px-4 text-center font-diagram text-xl font-bold text-black sm:top-6 sm:text-2xl"
      >
        Anatomy of the heart&hellip;
      </h1>

      <nav aria-label="Back to landing page" class="fixed top-2 left-3 z-50 sm:top-6 sm:left-6">
        <a
          href="index.html"
          class="inline-block rounded-full border border-sky-600 bg-white/90 px-3 py-1.5 text-xs font-bold text-sky-700 shadow-sm backdrop-blur transition hover:bg-sky-50 hover:shadow-[0_0_12px_3px_rgba(2,132,199,0.5)] active:bg-sky-50 active:shadow-[0_0_12px_3px_rgba(2,132,199,0.5)] sm:px-4 sm:py-2 sm:text-sm"
        >
          &lsaquo; Back
        </a>
      </nav>

      <section
        aria-label="Interactive heart cross-section"
        class="relative w-full flex-1 min-h-0 overflow-hidden sm:h-full sm:w-1/2 sm:flex-none"
      >
        <div
          id="slices"
          data-testid="slices"
          tabindex="0"
          role="region"
          aria-label="Heart cross-section slices — scroll horizontally"
          class="flex h-full w-full overflow-x-auto"
        >
          <div
            id="heart-stage"
            class="sticky top-0 left-0 flex h-full w-screen shrink-0 items-center justify-center pb-10 sm:w-full sm:pb-0"
          >
            <div class="relative flex flex-col items-center gap-y-2 sm:translate-y-[-1.5cm]">
              <div
                id="hint-card"
                class="z-20 order-last w-max max-w-[85vw] shrink-0 rounded-lg border-t-4 border-yellow-400 bg-white/95 px-3 py-1.5 text-center shadow-md sm:absolute sm:top-full sm:left-1/2 sm:order-none sm:mt-[0.6cm] sm:-translate-x-1/2"
              >
                <p class="text-[9px] leading-tight font-bold whitespace-nowrap text-slate-800 sm:text-[12px] sm:leading-snug">
                  Scroll to slice the heart open
                </p>
              </div>

              <div
                id="heart-explode"
                class="relative shrink-0 [perspective:1800px]"
                style="width: clamp(4.3cm, 48vw, 6.8cm); aspect-ratio: 285 / 394"
              >
                <div class="absolute inset-0 transform-3d [transform:rotateX(-8deg)]">
                  <!-- Base layer: the innermost view, always present, revealed once both doors above swing open. -->
                  <img
                    src="./src/assets/heart-layer-3-flow.png"
                    alt="Cross-section of the heart's chambers with arrows showing the direction of blood flow through the valves and great vessels"
                    class="absolute inset-0 h-full w-full object-contain [transform:translateZ(0px)]"
                  />

                  <!-- Door layer 2: the cutaway view, splits open on the second half of the scroll to reveal the flow layer. -->
                  <div data-door-layer="2" class="absolute inset-0 transform-3d [transform:translateZ(2px)]">
                    <img
                      data-door="left"
                      src="./src/assets/heart-layer-2-cutaway.png"
                      alt=""
                      aria-hidden="true"
                      class="absolute inset-0 h-full w-full object-contain backface-hidden [clip-path:inset(0_50%_0_0)]"
                    />
                    <img
                      data-door="right"
                      src="./src/assets/heart-layer-2-cutaway.png"
                      alt="Cross-section of the heart's chambers, opened to reveal the atria and ventricles"
                      class="absolute inset-0 h-full w-full object-contain backface-hidden [clip-path:inset(0_0_0_50%)]"
                    />
                  </div>

                  <!-- Door layer 1: the outer surface, splits open first to reveal the cutaway layer beneath. -->
                  <div data-door-layer="1" class="absolute inset-0 transform-3d [transform:translateZ(4px)]">
                    <img
                      data-door="left"
                      src="./src/assets/heart-layer-1-surface.png"
                      alt=""
                      aria-hidden="true"
                      class="absolute inset-0 h-full w-full object-contain backface-hidden [clip-path:inset(0_50%_0_0)]"
                    />
                    <img
                      data-door="right"
                      src="./src/assets/heart-layer-1-surface.png"
                      alt="The heart's outer surface, whole and unopened"
                      class="absolute inset-0 h-full w-full object-contain backface-hidden [clip-path:inset(0_0_0_50%)]"
                    />
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div aria-hidden="true" class="shrink-0" style="width: 400vw"></div>
        </div>
      </section>

      <section
        class="relative flex min-h-0 w-full flex-1 flex-col items-center justify-center gap-y-2 p-4 sm:h-full sm:w-1/2 sm:flex-none sm:flex-row sm:p-6"
        aria-labelledby="diagram-heading"
      >
        <h2 id="diagram-heading" class="sr-only">Labeled anatomy of the heart</h2>
        <div
          class="relative mx-auto min-h-0 w-auto max-w-[clamp(5.2cm,58vw,8cm)] flex-1 sm:max-w-full sm:h-auto sm:w-[var(--diagram-w)] sm:flex-none sm:translate-y-[-1.5cm]"
          style="--diagram-w: clamp(5.6cm, 60vw, 8.8cm)"
        >
          <img
            src="./src/assets/heart-labeled-diagram.png"
            alt="Labeled cross-section of the heart showing the superior and inferior venae cavae, aorta, pulmonary artery and veins, right and left atria, right and left ventricles, the mitral, pulmonary, aortic, and tricuspid valves, and the pericardium"
            class="block h-full w-auto max-w-full object-contain sm:h-auto sm:w-full"
          />

            href="https://en.wikipedia.org/wiki/Superior_vena_cava"
            target="_blank"
            rel="noopener"
            aria-label="Superior vena cava — read more on Wikipedia"

            style="left: 11.04%; top: 17.56%; width: 12.98%; height: 5.25%"
          ></a>

            href="https://en.wikipedia.org/wiki/Aorta"

            style="left: 49.29%; top: 18.95%; width: 5.93%; height: 2.78%"

            style="left: 73.42%; top: 21.41%; width: 12.27%; height: 5.89%"

            style="left: 79.04%; top: 30.84%; width: 12.17%; height: 5.78%"

            style="left: 54.5%; top: 38.33%; width: 7.57%; height: 5.89%"

            style="left: 30.98%; top: 47.86%; width: 8.38%; height: 4.6%"
          ></a>
          <a

            target="_blank"

            class="absolute rounded-lg transition before:absolute before:-inset-1 before:content-[''] sm:before:inset-0 hover:bg-sky-300/25 hover:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)] active:bg-sky-300/25 active:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)] focus:outline-none focus-visible:bg-sky-300/25 focus-visible:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)]"
            style="left: 80.57%; top: 46.47%; width: 7.05%; height: 5.89%"
          ></a>
          <a

            target="_blank"

            class="absolute rounded-lg transition before:absolute before:-inset-1 before:content-[''] sm:before:inset-0 hover:bg-sky-300/25 hover:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)] active:bg-sky-300/25 active:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)] focus:outline-none focus-visible:bg-sky-300/25 focus-visible:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)]"
            style="left: 9.41%; top: 60.49%; width: 13.8%; height: 6.1%"
          ></a>
          <a
            href="https://en.wikipedia.org/wiki/Aortic_valve"
            target="_blank"
            rel="noopener"
            aria-label="Aortic valve — read more on Wikipedia"
            class="absolute rounded-lg transition before:absolute before:-inset-1 before:content-[''] sm:before:inset-0 hover:bg-sky-300/25 hover:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)] active:bg-sky-300/25 active:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)] focus:outline-none focus-visible:bg-sky-300/25 focus-visible:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)]"
            style="left: 83.33%; top: 56.53%; width: 7.57%; height: 6%"
          ></a>
          <a
            href="https://en.wikipedia.org/wiki/Tricuspid_valve"
            target="_blank"

            style="left: 11.55%; top: 70.13%; width: 12.27%; height: 5.89%"
          ></a>
          <a

            style="left: 45.3%; top: 68.42%; width: 12.27%; height: 5.67%"
          ></a>
          <a
            href="https://en.wikipedia.org/wiki/Ventricle_(heart)"
            target="_blank"
            rel="noopener"
            aria-label="Left ventricle — read more on Wikipedia"
            class="absolute rounded-lg transition before:absolute before:-inset-1 before:content-[''] sm:before:inset-0 hover:bg-sky-300/25 hover:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)] active:bg-sky-300/25 active:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)] focus:outline-none focus-visible:bg-sky-300/25 focus-visible:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)]"
            style="left: 62.37%; top: 61.13%; width: 10.43%; height: 5.67%"

            target="_blank"

            id="diagram-hint-card"
            class="hidden sm:absolute sm:top-full sm:left-1/2 sm:z-20 sm:mt-[1.1cm] sm:block sm:w-max sm:max-w-[85vw] sm:translate-x-[calc(-50%+0.4cm)] rounded-lg border-t-4 border-yellow-400 bg-white/95 px-3 py-1.5 text-center shadow-md"
          >
            <p class="text-[9px] leading-tight font-bold whitespace-nowrap text-slate-800 sm:text-[12px] sm:leading-snug">

        <div class="flex shrink-0 items-center justify-center gap-x-8 sm:hidden">

            id="diagram-hint-card-mobile"
            class="z-20 w-max max-w-[85vw] rounded-lg border-t-4 border-yellow-400 bg-white/95 px-3 py-1.5 text-center shadow-md"
          >
            <p class="text-[9px] leading-tight font-bold whitespace-nowrap text-slate-800">Click on each label to know more&hellip;</p>
          </div>

          <a
            id="more-button-mobile"
            href="how-it-works.html"
            class="shrink-0 rounded-full border border-sky-600 bg-white/90 px-3 py-1.5 text-xs font-bold text-sky-700 shadow-sm backdrop-blur transition hover:bg-sky-50 hover:shadow-[0_0_12px_3px_rgba(2,132,199,0.5)] active:bg-sky-50 active:shadow-[0_0_12px_3px_rgba(2,132,199,0.5)]"
          >
            Next&hellip;
          </a>
        </div>

      <nav aria-label="Primary" class="fixed right-4 bottom-10 z-30">
        <a
          href="how-it-works.html"
          class="hidden rounded-full border border-sky-600 bg-white/90 px-4 py-2 text-sm font-bold text-sky-700 shadow-sm backdrop-blur transition hover:bg-sky-50 hover:shadow-[0_0_12px_3px_rgba(2,132,199,0.5)] active:bg-sky-50 active:shadow-[0_0_12px_3px_rgba(2,132,199,0.5)] sm:inline-block"
        >
          Click here to know how it functions
        </a>
      </nav>
    </main>
    <script type="module" src="./heart.ts"></script>
  </body>
</html>
