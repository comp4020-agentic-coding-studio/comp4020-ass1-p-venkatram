<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slices through the heart</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body
    class="bg-[url('./src/assets/heart-background.jpg')] bg-cover bg-center bg-fixed bg-no-repeat font-diagram text-slate-900"
  >
    <main class="relative flex flex-col sm:h-screen sm:flex-row sm:overflow-hidden">
      <h1
        id="anatomy-heading"
        class="pointer-events-none fixed inset-x-0 top-4 z-40 px-4 text-center font-diagram text-xl font-bold text-black sm:top-6 sm:text-2xl"
      >
        Anatomy of the heart&hellip;
      </h1>

      <nav aria-label="Primary" class="fixed bottom-10 right-4 z-30">
        <a
          href="how-it-works.html"
          class="rounded-full border border-sky-600 bg-white/90 px-4 py-2 text-sm font-bold text-sky-700 shadow-sm backdrop-blur transition hover:bg-sky-50"
        >
          Click here to know how it functions
        </a>
      </nav>

      <section
        aria-label="Interactive heart cross-section"
        class="relative h-screen w-full shrink-0 overflow-hidden sm:h-full sm:w-1/2"
      >
        <div
          id="slices"
          data-testid="slices"
          tabindex="0"
          role="region"
          aria-label="Heart cross-section slices — scroll horizontally"
          class="flex h-full w-full overflow-x-auto"
        >
          <div
            id="heart-stage"
            class="sticky top-0 left-0 flex h-full w-screen shrink-0 items-center justify-start pl-2 sm:w-full sm:justify-center sm:pl-0"
          >
            <div class="relative flex flex-col items-center" style="transform: translateY(-1.5cm)">
              <div
                id="heart-explode"
                class="relative [perspective:1800px]"
                style="width: 7cm; aspect-ratio: 285 / 394"
              >
                <div class="absolute inset-0 transform-3d [transform:rotateX(-8deg)]">
                  <!-- Base layer: the innermost view, always present, revealed once both doors above swing open. -->
                  <img
                    src="./src/assets/heart-layer-3-flow.png"
                    alt="Cross-section of the heart's chambers with arrows showing the direction of blood flow through the valves and great vessels"
                    class="absolute inset-0 h-full w-full object-contain [transform:translateZ(0px)]"
                  />

                  <!-- Door layer 2: the cutaway view, splits open on the second half of the scroll to reveal the flow layer. -->
                  <div data-door-layer="2" class="absolute inset-0 transform-3d [transform:translateZ(2px)]">
                    <img
                      data-door="left"
                      src="./src/assets/heart-layer-2-cutaway.png"
                      alt=""
                      aria-hidden="true"
                      class="absolute inset-0 h-full w-full object-contain backface-hidden [clip-path:inset(0_50%_0_0)]"
                    />
                    <img
                      data-door="right"
                      src="./src/assets/heart-layer-2-cutaway.png"
                      alt="Cross-section of the heart's chambers, opened to reveal the atria and ventricles"
                      class="absolute inset-0 h-full w-full object-contain backface-hidden [clip-path:inset(0_0_0_50%)]"
                    />
                  </div>

                  <!-- Door layer 1: the outer surface, splits open first to reveal the cutaway layer beneath. -->
                  <div data-door-layer="1" class="absolute inset-0 transform-3d [transform:translateZ(4px)]">
                    <img
                      data-door="left"
                      src="./src/assets/heart-layer-1-surface.png"
                      alt=""
                      aria-hidden="true"
                      class="absolute inset-0 h-full w-full object-contain backface-hidden [clip-path:inset(0_50%_0_0)]"
                    />
                    <img
                      data-door="right"
                      src="./src/assets/heart-layer-1-surface.png"
                      alt="The heart's outer surface, whole and unopened"
                      class="absolute inset-0 h-full w-full object-contain backface-hidden [clip-path:inset(0_0_0_50%)]"
                    />
                  </div>
                </div>
              </div>

              <div
                id="hint-card"
                class="absolute top-full left-1/2 z-20 mt-[0.6cm] -translate-x-1/2 rounded-xl border-4 border-yellow-400 bg-white/95 px-3 py-2 text-center shadow-md"
                style="width: 4cm; max-width: 70vw"
              >
                <p class="text-[9px] leading-tight font-bold text-slate-800 sm:text-[12px] sm:leading-snug">
                  Scroll to slice the heart open
                </p>
              </div>
            </div>
          </div>

          <div aria-hidden="true" class="shrink-0" style="width: 400vw"></div>
        </div>
      </section>

      <section
        class="relative flex w-full items-center justify-center p-6 sm:h-full sm:w-1/2"
        aria-labelledby="diagram-heading"
      >
        <h2 id="diagram-heading" class="sr-only">Labeled anatomy of the heart</h2>
        <div class="relative mx-auto" style="width: 9cm; transform: translateY(-1.5cm)">
          <img
            src="./src/assets/heart-labeled-diagram.png"
            alt="Labeled cross-section of the heart showing the superior and inferior venae cavae, aorta, pulmonary artery and veins, right and left atria, right and left ventricles, the mitral, pulmonary, aortic, and tricuspid valves, and the pericardium"
            class="block h-auto w-full"
          />

          <a
            href="https://en.wikipedia.org/wiki/Superior_vena_cava"
            target="_blank"
            rel="noopener"
            aria-label="Superior vena cava — read more on Wikipedia"
            class="absolute rounded-lg transition hover:bg-sky-300/25 hover:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)] focus:outline-none focus-visible:bg-sky-300/25 focus-visible:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)]"
            style="left: 11.04%; top: 17.56%; width: 12.98%; height: 5.25%"
          ></a>
          <a
            href="https://en.wikipedia.org/wiki/Aorta"
            target="_blank"
            rel="noopener"
            aria-label="Aorta — read more on Wikipedia"
            class="absolute rounded-lg transition hover:bg-sky-300/25 hover:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)] focus:outline-none focus-visible:bg-sky-300/25 focus-visible:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)]"
            style="left: 49.29%; top: 18.95%; width: 5.93%; height: 2.78%"
          ></a>
          <a
            href="https://en.wikipedia.org/wiki/Pulmonary_artery"

            class="absolute rounded-lg transition hover:bg-sky-300/25 hover:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)] focus:outline-none focus-visible:bg-sky-300/25 focus-visible:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)]"
            style="left: 73.42%; top: 21.41%; width: 12.27%; height: 5.89%"
          ></a>
          <a
            href="https://en.wikipedia.org/wiki/Pulmonary_vein"
            target="_blank"
            rel="noopener"
            aria-label="Pulmonary veins — read more on Wikipedia"
            class="absolute rounded-lg transition hover:bg-sky-300/25 hover:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)] focus:outline-none focus-visible:bg-sky-300/25 focus-visible:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)]"
            style="left: 79.04%; top: 30.84%; width: 12.17%; height: 5.78%"
          ></a>
          <a
            href="https://en.wikipedia.org/wiki/Atrium_(heart)"

            style="left: 54.5%; top: 38.33%; width: 7.57%; height: 5.89%"
          ></a>
          <a
            href="https://en.wikipedia.org/wiki/Atrium_(heart)"
            target="_blank"
            rel="noopener"
            aria-label="Right atrium — read more on Wikipedia"
            class="absolute rounded-lg transition hover:bg-sky-300/25 hover:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)] focus:outline-none focus-visible:bg-sky-300/25 focus-visible:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)]"
            style="left: 30.98%; top: 47.86%; width: 8.38%; height: 4.6%"

          <a

            rel="noopener"
            aria-label="Mitral valve — read more on Wikipedia"
            class="absolute rounded-lg transition hover:bg-sky-300/25 hover:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)] focus:outline-none focus-visible:bg-sky-300/25 focus-visible:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)]"
            style="left: 80.57%; top: 46.47%; width: 7.05%; height: 5.89%"
          ></a>
          <a
            href="https://en.wikipedia.org/wiki/Pulmonary_valve"
            target="_blank"
            rel="noopener"
            aria-label="Pulmonary valve — read more on Wikipedia"
            class="absolute rounded-lg transition hover:bg-sky-300/25 hover:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)] focus:outline-none focus-visible:bg-sky-300/25 focus-visible:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)]"
            style="left: 9.41%; top: 60.49%; width: 13.8%; height: 6.1%"
          ></a>
          <a
            href="https://en.wikipedia.org/wiki/Aortic_valve"
            target="_blank"
            rel="noopener"
            aria-label="Aortic valve — read more on Wikipedia"

            style="left: 83.33%; top: 56.53%; width: 7.57%; height: 6%"
          ></a>
          <a
            href="https://en.wikipedia.org/wiki/Tricuspid_valve"
            target="_blank"
            rel="noopener"
            aria-label="Tricuspid valve — read more on Wikipedia"
            class="absolute rounded-lg transition hover:bg-sky-300/25 hover:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)] focus:outline-none focus-visible:bg-sky-300/25 focus-visible:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)]"
            style="left: 11.55%; top: 70.13%; width: 12.27%; height: 5.89%"
          ></a>
          <a
            href="https://en.wikipedia.org/wiki/Ventricle_(heart)"
            target="_blank"
            rel="noopener"
            aria-label="Right ventricle — read more on Wikipedia"
            class="absolute rounded-lg transition hover:bg-sky-300/25 hover:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)] focus:outline-none focus-visible:bg-sky-300/25 focus-visible:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)]"
            style="left: 45.3%; top: 68.42%; width: 12.27%; height: 5.67%"
          ></a>
          <a
            href="https://en.wikipedia.org/wiki/Ventricle_(heart)"
            target="_blank"
            rel="noopener"

            style="left: 62.37%; top: 61.13%; width: 10.43%; height: 5.67%"
          ></a>
          <a
            href="https://en.wikipedia.org/wiki/Inferior_vena_cava"
            target="_blank"
            rel="noopener"
            aria-label="Inferior vena cava — read more on Wikipedia"
            class="absolute rounded-lg transition hover:bg-sky-300/25 hover:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)] focus:outline-none focus-visible:bg-sky-300/25 focus-visible:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)]"
            style="left: 20.04%; top: 88.86%; width: 23.11%; height: 2.68%"
          ></a>
          <a
            href="https://en.wikipedia.org/wiki/Pericardium"
            target="_blank"
            rel="noopener"
            aria-label="Pericardium — read more on Wikipedia"
            class="absolute rounded-lg transition hover:bg-sky-300/25 hover:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)] focus:outline-none focus-visible:bg-sky-300/25 focus-visible:shadow-[0_0_18px_6px_rgba(56,189,248,0.65)]"
            style="left: 75.87%; top: 88.76%; width: 13.5%; height: 3.53%"
          ></a>

          <div
            id="diagram-hint-card"
            class="absolute top-full left-1/2 z-20 mt-[1.1cm] -translate-x-1/2 rounded-xl border-4 border-yellow-400 bg-white/95 px-3 py-2 text-center shadow-md"
            style="width: 4cm; max-width: 70vw"
          >
            <p class="text-[9px] leading-tight font-bold text-slate-800 sm:text-[12px] sm:leading-snug">
              Click on the label to know more&hellip;
            </p>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./heart.ts"></script>
  </body>
</html>
